<!-- static/images/auth-illustration.svg -->
<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient Circle -->
  <circle cx="300" cy="250" r="200" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D4ED8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1D4ED8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.1"/>
    </filter>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Main Card (Shop/Storefront) -->
  <rect x="150" y="120" width="300" height="280" rx="16" fill="#FFFFFF" filter="url(#shadow1)" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Card Header -->
  <rect x="150" y="120" width="300" height="60" rx="16" fill="url(#grad2)" opacity="0.1"/>
  <rect x="150" y="165" width="300" height="15" fill="none"/>
  
  <!-- Shop Logo Placeholder -->
  <circle cx="200" cy="150" r="20" fill="url(#grad2)"/>
  <text x="200" y="157" text-anchor="middle" fill="white" font-size="14" font-weight="bold">V</text>
  
  <!-- Shop Name Lines -->
  <rect x="235" y="142" width="120" height="8" rx="4" fill="#1D4ED8" opacity="0.8"/>
  <rect x="235" y="154" width="80" height="6" rx="3" fill="#64748B" opacity="0.6"/>
  
  <!-- Trust Badge -->
  <circle cx="420" cy="150" r="18" fill="#22C55E" opacity="0.2"/>
  <circle cx="420" cy="150" r="12" fill="#22C55E"/>
  <path d="M416 150L419 153L424 147" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Product Grid (Inside Card) -->
  <!-- Product 1 -->
  <rect x="180" y="200" width="100" height="120" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="180" y="200" width="100" height="70" rx="8" fill="url(#grad2)" opacity="0.15"/>
  <rect x="190" y="330" width="70" height="6" rx="3" fill="#1D4ED8" opacity="0.8"/>
  <rect x="190" y="340" width="50" height="5" rx="2.5" fill="#64748B" opacity="0.5"/>
  <circle cx="265" cy="333" r="8" fill="#22C55E"/>
  <path d="M262 333L264 335L268 330" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Product 2 -->
  <rect x="320" y="200" width="100" height="120" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="320" y="200" width="100" height="70" rx="8" fill="url(#grad2)" opacity="0.15"/>
  <rect x="330" y="330" width="70" height="6" rx="3" fill="#1D4ED8" opacity="0.8"/>
  <rect x="330" y="340" width="50" height="5" rx="2.5" fill="#64748B" opacity="0.5"/>
  <circle cx="405" cy="333" r="8" fill="#22C55E"/>
  <path d="M402 333L404 335L408 330" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Product 3 -->
  <rect x="180" y="340" width="100" height="120" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="180" y="340" width="100" height="70" rx="8" fill="url(#grad2)" opacity="0.15"/>
  <rect x="190" y="470" width="70" height="6" rx="3" fill="#1D4ED8" opacity="0.8"/>
  <rect x="190" y="480" width="50" height="5" rx="2.5" fill="#64748B" opacity="0.5"/>
  <circle cx="265" cy="473" r="8" fill="#22C55E"/>
  <path d="M262 473L264 475L268 470" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Product 4 -->
  <rect x="320" y="340" width="100" height="120" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <rect x="320" y="340" width="100" height="70" rx="8" fill="url(#grad2)" opacity="0.15"/>
  <rect x="330" y="470" width="70" height="6" rx="3" fill="#1D4ED8" opacity="0.8"/>
  <rect x="330" y="480" width="50" height="5" rx="2.5" fill="#64748B" opacity="0.5"/>
  <circle cx="405" cy="473" r="8" fill="#22C55E"/>
  <path d="M402 473L404 475L408 470" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Floating Elements (Trust & Security) -->
  <!-- Shield Icon (Top Right) -->
  <circle cx="480" cy="100" r="35" fill="#FFFFFF" filter="url(#shadow2)"/>
  <path d="M480 85L480 85C480 85 492 90 492 100C492 110 480 118 480 118C480 118 468 110 468 100C468 90 480 85 480 85Z" fill="url(#grad2)"/>
  <path d="M477 100L480 103L485 97" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Star Rating (Bottom Left) -->
  <circle cx="120" cy="380" r="35" fill="#FFFFFF" filter="url(#shadow2)"/>
  <polygon points="120,360 123,368 132,368 125,374 127,383 120,378 113,383 115,374 108,368 117,368" fill="#F59E0B"/>
  <text x="120" y="395" text-anchor="middle" fill="#64748B" font-size="10" font-weight="600">4.8★</text>
  
  <!-- Secure Payment Badge (Bottom Right) -->
  <circle cx="480" cy="380" r="35" fill="#FFFFFF" filter="url(#shadow2)"/>
  <rect x="468" y="370" width="24" height="18" rx="3" fill="url(#grad2)"/>
  <rect x="472" y="373" width="16" height="12" rx="2" fill="white" opacity="0.3"/>
  <path d="M474 379H482M474 382H480" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <text x="480" y="395" text-anchor="middle" fill="#64748B" font-size="9" font-weight="600">Secure</text>
  
  <!-- Connection Lines (Decorative) -->
  <path d="M450 115C460 125 465 135 465 150" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M145 365C135 370 130 375 128 385" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M455 365C465 370 472 375 475 385" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  
  <!-- Background Decorative Elements -->
  <circle cx="50" cy="50" r="30" fill="#1D4ED8" opacity="0.05"/>
  <circle cx="550" cy="450" r="40" fill="#1D4ED8" opacity="0.05"/>
  <circle cx="520" cy="80" r="20" fill="#22C55E" opacity="0.08"/>
  <circle cx="80" cy="420" r="25" fill="#F59E0B" opacity="0.08"/>
  
  <!-- Trust Score Meter (Bottom Center) -->
  <rect x="225" y="420" width="150" height="40" rx="20" fill="#FFFFFF" filter="url(#shadow2)" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="300" y="435" text-anchor="middle" fill="#64748B" font-size="10" font-weight="500">Trust Score</text>
  <rect x="245" y="442" width="110" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="245" y="442" width="95" height="8" rx="4" fill="url(#grad2)"/>
  <text x="360" y="449" text-anchor="middle" fill="#1D4ED8" font-size="11" font-weight="700">92%</text>
</svg>